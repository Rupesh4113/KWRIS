# KWRIS Rainfall Validation & Correction Platform Configuration
# Based on the Manual on Rainfall Data Validation (National Hydrology Project, May 2019)

app:
  title: "KWRIS Rainfall Data Quality & Validation Platform"
  subtitle: "Automated rainfall quality assessment, anomaly detection, gap analysis, and traceable data correction."
  primary_color: "#A30000"
  secondary_color: "#FFFFFF"
  missing_codes: [-99, -999, -9999, 9999, "NA", "NaN", "null", "NULL", "-"]

primary_validation:
  p1_entry_check:
    enabled: true
    flag_duplicate_dates: true
    missing_codes: [-99, -999, -9999, 9999]
  p2_min_limit:
    enabled: true
    min_rainfall_mm: 0.0
  p3_max_limit:
    enabled: true
    default_daily_max_mm: 350.0   # IMD PMP / Karnataka regional ceiling default
    default_hourly_max_mm: 120.0  # 50-year 1-hour maximum
  p4_upper_warning:
    enabled: true
    method: "normal_multiplier"   # "normal_multiplier" (mean + 1.96*std) or "percentile_98"
    multiplier: 1.96
    percentile: 98.0
    min_sample_size: 15
  p5_dual_gauge:
    enabled: true
    tolerance_pct: 5.0            # Ignore differences below 5%
    rainfall_day_cutoff: "08:30"

secondary_validation:
  s1_pick_neighbours:
    enabled: true
    max_neighbours: 8
    max_per_quadrant: 2
    search_radius_km: 35.0
  s2_neighbour_estimate:
    enabled: true
    weighting_power: 2            # 1 / distance^2
    absolute_diff_limit_mm: 45.0  # Flag if discrepancy > 45 mm
    std_multiplier: 2.0           # or discrepancy > 2 * std(neighbours)
    low_rain_threshold_mm: 2.5    # Ignore small discrepancies when both are low
  s3_wrong_day:
    enabled: true
    check_one_day_shift: true
    shift_test_window_days: 7
  s4_accumulated_totals:
    enabled: true
    min_consecutive_zeros: 2
    spike_ratio_to_daily_mean: 3.5
    check_weekend_patterns: true
  s5_missed_entries:
    enabled: true
    min_neighbour_rain_mm: 5.0
    min_consecutive_missed: 2
  s6_rainy_days:
    enabled: true
    min_rain_threshold_mm: 0.1    # Standard definition of rainy day
    tolerance_ratio: 0.5          # Flag if rainy days < 50% of neighbour average
  s7_monthly_yearly_totals:
    enabled: true
    lower_std_multiplier: 1.645   # mean - 1.645 * std
    upper_std_multiplier: 1.96    # mean + 1.96 * std
    percentile_lower: 5.0
    percentile_upper: 95.0
  s8_double_mass:
    enabled: true
    min_neighbours: 3
    min_shift_years: 5.0
    slope_change_threshold: 0.15  # Flag if slope changes by > 15%

gap_filling:
  g1_keep_missing:
    enabled: true
  g2_second_gauge:
    enabled: true
    distribute_hourly: true
  g3_wrong_day_shift:
    enabled: true
  g4_split_accumulated:
    enabled: true
    numerical_tolerance_mm: 0.05
  g5_neighbour_filling:
    enabled: true
    normal_diff_threshold_pct: 10.0 # <= 10%: simple average, > 10%: normal ratio
    min_neighbours_for_avg: 3
    method: "normal_ratio"        # "simple_average", "normal_ratio", or "idw"
  g6_account_extra_rainy_days:
    enabled: true
  g7_avoid_straight_line:
    prevent_linear_interpolation: true
  g8_long_term_shift_correction:
    enabled: true

statistical_analysis:
  a1_standard_periods:
    daily_cutoff: "08:30"
    weekly_periods: 52
    ten_daily_periods: 3
  a2_tipping_bucket:
    bucket_size_mm: 0.2
    regularization_interval_min: 60
  a3_completeness:
    min_monthly_completeness_pct: 90.0
    min_yearly_completeness_pct: 90.0
  a4_station_stats:
    calculate_skewness: true
  a5_consistency_tests:
    perform_mann_whitney: true
    perform_wilcoxon: true
    perform_ttest: true

station_ranking:
  weights:
    missing_pct: 0.30
    doubtful_pct: 0.25
    severity_p3: 0.15
    recency: 0.10
    consecutive_days_affected: 0.10
    lack_of_neighbours: 0.10
